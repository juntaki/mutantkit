coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "diff, files"
  require_changes: false

# Mirrors sonar-project.properties' sonar.exclusions/sonar.coverage.exclusions
# so Sonar and Codecov measure the same "production code" denominator:
# sample fixtures and build output are excluded from both, as is the
# standalone eligibility classifier executable.
ignore:
  - "Tests/**"
  - "Fixtures/**"
  - ".build/**"
  - "Sources/SchemataEligibilityClassifier/**"
