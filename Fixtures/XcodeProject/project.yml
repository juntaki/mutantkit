# Acceptance fixture: a real .xcodeproj driven by xcodebuild.
#
# The generated .xcodeproj is committed alongside this manifest so the fixture
# works without xcodegen installed. Regenerate with:
#   cd Fixtures/XcodeProject && xcodegen generate
#
# This fixture is what proves the xcodebuild path end to end: build-for-testing
# into a sandbox-local DerivedData, locate the .xctestrun by searching for it,
# then test-without-building against a simulator destination.
name: Checkout
options:
  bundleIdPrefix: dev.mutantkit.fixture
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Checkout:
    type: framework
    platform: iOS
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  CheckoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Checkout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Gate 3 Phase H3: a dedicated, unconditionally-hanging test — safe only
  # because it belongs to its own scheme below, never the "Checkout" one
  # every other acceptance suite (and mutantkit's own baseline
  # establishment) uses. `HangSpikeTests.testIntentionalHang` in
  # CheckoutTests is env-var-gated instead, precisely because it *does*
  # share the "Checkout" scheme's test action.
  HangContainmentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HangContainmentTests]
    dependencies:
      - target: Checkout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Gate 3 Phase H8: a real, launchable iOS app — not a bare framework —
  # so HangAppTests can be an *app-hosted* unit test bundle
  # (`IsAppHostedTestBundle: true`), the structural property confirmed to
  # distinguish a real, large production iOS app (whose own unit-test
  # bundle is hosted by its own app binary) from every earlier synthetic
  # hang fixture above (hosted by the generic `xctest` runner, no real
  # app process at all).
  HangApp:
    type: application
    platform: iOS
    sources: [HangApp]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HangAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HangAppTests]
    dependencies:
      - target: HangApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HangApp.app/HangApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Phase C2 (competitive-parity program): proves Swift Testing support
  # under an Xcode *project* (not just SwiftPM) is real, not just parser-
  # level. Isolated on its own scheme for the same reason
  # HangContainmentTests/HangAppTests are: `xcodebuild -scheme Checkout
  # ...` — every other suite sharing this fixture — must never build or
  # run it.
  SwiftTestingCheckoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SwiftTestingCheckoutTests]
    dependencies:
      - target: Checkout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # F1-P0: mirrors Fixtures/PerTestProfilingPartialFailure (SwiftPM) so
  # XcodeBuildAdapter.measurePerTestCoverage's own all-or-nothing contract
  # can be pinned against a real xcodebuild run, the same way P12-B pinned
  # it for SwiftPM. Isolated on its own scheme for the same reason
  # HangContainmentTests/SwiftTestingCheckoutTests are: `xcodebuild -scheme
  # Checkout ...` — every other suite sharing this fixture — must never
  # build or run it.
  PerTestWidgets:
    type: framework
    platform: iOS
    sources: [PerTestWidgets]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PerTestProfilingPartialFailureTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PerTestProfilingPartialFailureTests]
    dependencies:
      - target: PerTestWidgets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Checkout:
    build:
      targets:
        Checkout: all
        CheckoutTests: [test]
    test:
      targets: [CheckoutTests]

  # Isolated on purpose (see HangContainmentTests' own doc comment above):
  # a completely separate scheme so `xcodebuild -scheme Checkout ...` —
  # every other suite sharing this fixture — never builds or runs it.
  HangContainmentDemo:
    build:
      targets:
        Checkout: all
        HangContainmentTests: [test]
    test:
      targets: [HangContainmentTests]

  # Isolated the same way HangContainmentDemo is above.
  HangAppDemo:
    build:
      targets:
        HangApp: all
        HangAppTests: [test]
    test:
      targets: [HangAppTests]

  # Isolated the same way HangContainmentDemo is above.
  SwiftTestingCheckoutDemo:
    build:
      targets:
        Checkout: all
        SwiftTestingCheckoutTests: [test]
    test:
      targets: [SwiftTestingCheckoutTests]

  # Isolated the same way HangContainmentDemo is above.
  PerTestProfilingPartialFailureDemo:
    build:
      targets:
        PerTestWidgets: all
        PerTestProfilingPartialFailureTests: [test]
    test:
      targets: [PerTestProfilingPartialFailureTests]
