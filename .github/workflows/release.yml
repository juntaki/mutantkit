name: Release

# Builds a real `mutantkit` release binary, packages it exactly as a user
# downloads it (tarball + SHA256SUMS, no repo checkout required to use it),
# then proves the whole quick-start path works on a machine that never
# cloned this repo: extract -> doctor -> init -> plan -> run, against a
# freshly generated SwiftPM fixture. Only a macOS arm64 binary for now —
# no universal binary, no notarization, no auto-update; see
# Scripts/release-build.sh.
#
# workflow_dispatch lets this whole pipeline be validated before any real
# tag exists. A `v*` tag push additionally publishes a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode (26.6)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dispatch.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: Scripts/release-build.sh "${{ steps.version.outputs.version }}" dist

      # Sigstore-backed build provenance for the exact tarball a user
      # downloads — verifiable with `gh attestation verify`. This is
      # GitHub artifact attestation, not code signing: it proves which
      # workflow run/commit produced this exact file, not a code-signing
      # identity. Restored after being dropped from an earlier version of
      # this workflow, which had left action.yml's "signed release
      # tarball" wording pointing at nothing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/mutantkit-macos-arm64.tar.gz
            dist/SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutantkit-macos-arm64
          path: |
            dist/mutantkit-macos-arm64.tar.gz
            dist/SHA256SUMS
          retention-days: 30

  clean-machine-e2e:
    needs: build
    runs-on: macos-26
    steps:
      # Deliberately no actions/checkout here — the point of this job is to
      # prove the quick-start path works with no repo present at all, the
      # way a real user experiences it.
      - name: Download the packaged binary only
        uses: actions/download-artifact@v4
        with:
          name: mutantkit-macos-arm64
          path: download

      - name: Verify checksum
        working-directory: download
        run: shasum -a 256 -c SHA256SUMS

      - name: Extract
        working-directory: download
        run: tar xzf mutantkit-macos-arm64.tar.gz

      - name: mutantkit --version
        run: download/mutantkit-macos-arm64/mutantkit --version

      - name: mutantkit doctor (no project yet — must report that honestly)
        working-directory: download
        run: |
          set -euo pipefail
          ./mutantkit-macos-arm64/mutantkit doctor || true

      - name: Generate a minimal SwiftPM fixture project (no clone of this repo)
        run: |
          set -euo pipefail
          mkdir -p fixture/Sources/Calc fixture/Tests/CalcTests
          cat > fixture/Package.swift <<'EOF'
          // swift-tools-version:6.0
          import PackageDescription

          let package = Package(
              name: "Calc",
              targets: [
                  .target(name: "Calc"),
                  .testTarget(name: "CalcTests", dependencies: ["Calc"])
              ]
          )
          EOF
          cat > fixture/Sources/Calc/Calc.swift <<'EOF'
          public func calcAdd(_ a: Int, _ b: Int) -> Int {
              a + b
          }

          public func isPositive(_ x: Int) -> Bool {
              x > 0
          }
          EOF
          cat > fixture/Tests/CalcTests/CalcTests.swift <<'EOF'
          import XCTest
          @testable import Calc

          final class CalcTests: XCTestCase {
              func testCalcAdd() {
                  XCTAssertEqual(calcAdd(2, 3), 5)
              }
              func testIsPositive() {
                  XCTAssertTrue(isPositive(1))
                  XCTAssertFalse(isPositive(-1))
              }
          }
          EOF

      - name: mutantkit doctor (fixture present)
        working-directory: fixture
        run: ../download/mutantkit-macos-arm64/mutantkit doctor

      - name: mutantkit init
        working-directory: fixture
        run: |
          set -euo pipefail
          ../download/mutantkit-macos-arm64/mutantkit init
          # Asserts init's own test-target auto-detection actually found
          # CalcTests unassisted — this used to be hand-edited into
          # mutantkit.yml by a Python script after init ran, which meant a
          # real regression in init's auto-detection could break silently
          # (the hand-edit would keep "fixing" the file even if init itself
          # stopped detecting anything). No hand-edit now: if init's own
          # detection ever regresses, this step fails loudly instead.
          grep -A2 '^tests:' mutantkit.yml
          grep -qx '    - CalcTests' mutantkit.yml || {
            echo "::error::mutantkit init did not auto-detect CalcTests as a test target"
            exit 1
          }

      - name: mutantkit plan
        working-directory: fixture
        run: ../download/mutantkit-macos-arm64/mutantkit plan

      - name: mutantkit run
        working-directory: fixture
        run: |
          set -euo pipefail
          ../download/mutantkit-macos-arm64/mutantkit run --plan plan.json --output report.json
          python3 -c "
          import json
          report = json.load(open('report.json'))
          assert len(report['integrity']['violations']) == 0, report['integrity']['violations']
          assert len(report['results']) == 2, report['results']
          print('clean-machine E2E gate: PASSED')
          "

  # release-validation.yml (workflow_dispatch-only; the ~80min real-simulator
  # evidence suite dropped from ci.yml) documents itself as the thing that
  # stands between a tag push and an unvalidated release. That claim is only
  # true if something here actually checks it landed. This job is that check:
  # it refuses to let publish-release proceed unless this exact commit SHA
  # has at least one completed, successful release-validation.yml run.
  require-validation:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require the *latest* release-validation run for this commit to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          runs="$(gh api "repos/${{ github.repository }}/actions/workflows/release-validation.yml/runs?head_sha=${sha}&status=completed" --jq '.workflow_runs')"
          run_count="$(echo "$runs" | jq 'length')"
          if [ "$run_count" -eq 0 ]; then
            echo "::error::No completed release-validation.yml run found for commit ${sha}. Dispatch release-validation.yml against this commit and wait for release-validation-gate to pass before tagging a release."
            exit 1
          fi
          # v0.6 Distribution Trust: the *latest* completed run for this
          # exact commit must have succeeded -- not "any run ever did".
          # This SHA can only be validated by re-dispatching against it
          # (its own commit content, including this workflow file, is
          # fixed by the SHA), but a flaky pass followed by a genuine
          # investigative re-run that failed must not leave the earlier
          # lucky pass permanently satisfying this gate. Sort by
          # created_at, not array order, since the API's own ordering is
          # not part of its documented contract.
          latest="$(echo "$runs" | jq 'sort_by(.created_at) | last')"
          latest_conclusion="$(echo "$latest" | jq -r '.conclusion')"
          latest_id="$(echo "$latest" | jq -r '.id')"
          latest_created="$(echo "$latest" | jq -r '.created_at')"
          if [ "$latest_conclusion" != "success" ]; then
            echo "::error::The most recent completed release-validation.yml run for commit ${sha} (run ${latest_id}, ${latest_created}) concluded '${latest_conclusion}', not 'success' -- an earlier successful run for this same commit, if any, does not count. Dispatch release-validation.yml again and wait for a genuine success before tagging a release."
            exit 1
          fi
          echo "Latest release-validation.yml run for commit ${sha} (run ${latest_id}, ${latest_created}) succeeded."

  # v1 contract (2026-09-12): a GitHub Release is not the end of this
  # pipeline's job, only the point where the real download/install/
  # Homebrew paths *become testable* -- none of them can be exercised
  # against a tag that does not exist yet. Publishing straight to "latest"
  # here would mean a consumer could pick this release up (via `@vX.Y.Z`,
  # `latest`, or `brew install`) before this workflow has actually proven
  # any of those paths works, and a failure two jobs from now (the real
  # Action install, or the Homebrew tap sync) would leave a broken release
  # sitting there looking exactly as done as a good one. Publishing as a
  # `--prerelease` closes that gap: the tag and assets exist (so
  # downstream jobs have something real to install from) but the release
  # is not yet "Latest" and a consumer who asks for `latest` will not get
  # it. `finalize-release` below is the only place that promotes it.
  publish-release:
    if: github.ref_type == 'tag'
    needs: [build, clean-machine-e2e, require-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mutantkit-macos-arm64
          path: dist

      - name: Create GitHub Release (prerelease -- promoted only after downstream verification, see finalize-release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            dist/mutantkit-macos-arm64.tar.gz dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "mutantkit ${{ needs.build.outputs.version }}" \
            --generate-notes \
            --prerelease

  # The real consumer path, not a simulation of it -- but invoked directly
  # via `Scripts/action/install.sh` (the exact script `action.yml`'s own
  # "Install mutantkit" step calls) rather than a dynamic
  # `uses: juntaki/mutantkit@${{ github.ref_name }}`, since `uses:`
  # resolving a ref built from workflow context inside the very workflow
  # that ref points at is unproven, higher-risk syntax to stake the release
  # gate on -- a plain script invocation is not. Setting `MUTANTKIT_ACTION_REF`
  # to this run's own tag and leaving the version input empty reproduces
  # exactly what a real `uses: juntaki/mutantkit@${{ github.ref_name }}`
  # consumer's install step does internally (see install.sh's own version-
  # resolution comment). `action-smoke-test.yml` (part of `ci.yml`, runs on
  # every PR) already covers `mode: install`/`mode: ci` behavior against a
  # scripted binary seam -- what it structurally cannot cover is whether
  # *this exact just-published release* is actually fetchable, checksum-
  # verifiable, and attestation-verifiable from the outside, because
  # nothing under that tag exists until `publish-release` runs. This job
  # is that missing proof, gating whether the release ever leaves
  # prerelease status.
  verify-published-action-install:
    if: github.ref_type == 'tag'
    needs: [build, publish-release]
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Install mutantkit exactly as a real `uses: juntaki/mutantkit@<tag>` consumer's install step would"
        shell: bash
        env:
          MUTANTKIT_ACTION_VERSION_INPUT: ""
          MUTANTKIT_ACTION_REF: ${{ github.ref_name }}
          MUTANTKIT_ACTION_GH_TOKEN: ${{ github.token }}
          MUTANTKIT_ACTION_TEST_BINARY_DIR: ""
        run: "${{ github.workspace }}/Scripts/action/install.sh"

      - name: Confirm the published release's binary actually installed and runs
        shell: bash
        run: |
          set -euo pipefail
          installed_version="$(mutantkit --version | head -n 1)"
          echo "Installed: $installed_version"
          case "$installed_version" in
            *"${{ needs.build.outputs.version }}"*) ;;
            *)
              echo "::error::mutantkit --version reported '$installed_version', expected it to name version '${{ needs.build.outputs.version }}' -- the published release tag may not have resolved to the release this run just built."
              exit 1
              ;;
          esac

  # v1 contract (2026-09-12): the Homebrew tap is a first-class install
  # path, so it must not drift from the latest release the way it once
  # did (the formula stayed pinned two releases behind, unbumped, with
  # nothing here or in the tap noticing). This dispatches the tap's own
  # idempotent sync-release.yml and waits for it to actually succeed --
  # fail-closed on both halves: a missing token, or the tap's own sync
  # failing/timing out, fails this release's workflow run rather than
  # silently leaving the tap behind. It never writes to the tap repo
  # directly; the token it uses is scoped to triggering and reading that
  # one workflow's runs, not to the tap's contents (the tap's own workflow
  # commits with its own repo-scoped GITHUB_TOKEN instead).
  dispatch-homebrew-sync:
    if: github.ref_type == 'tag'
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger and wait for juntaki/homebrew-mutantkit's sync-release workflow
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_DISPATCH_TOKEN is not set. The Homebrew tap is a first-class, v1 install path and must not silently drift from this release -- create a fine-grained PAT scoped only to juntaki/homebrew-mutantkit with Actions: write (and default Metadata: read), and set it as this repo's HOMEBREW_TAP_DISPATCH_TOKEN secret."
            exit 1
          fi

          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run sync-release.yml \
            --repo juntaki/homebrew-mutantkit \
            -f version="${{ github.ref_name }}"

          # workflow_dispatch does not hand back a run ID directly -- poll
          # for the run it just created (created strictly after `before`,
          # for this exact workflow) rather than trusting "the most recent
          # run", which could otherwise race a concurrent manual dispatch.
          run_id=""
          for _ in $(seq 1 30); do
            sleep 5
            run_id="$(gh run list --repo juntaki/homebrew-mutantkit --workflow sync-release.yml \
              --json databaseId,createdAt --jq \
              "[.[] | select(.createdAt > \"$before\")] | sort_by(.createdAt) | first | .databaseId // empty")"
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::Dispatched juntaki/homebrew-mutantkit's sync-release.yml but could not find the resulting run within 150s."
            exit 1
          fi

          echo "Waiting on juntaki/homebrew-mutantkit sync-release run $run_id..."
          gh run watch "$run_id" --repo juntaki/homebrew-mutantkit --exit-status

  # The only place this release stops being a `--prerelease`. Both
  # downstream consumer paths this release promises -- the GitHub Action
  # (`verify-published-action-install`) and Homebrew
  # (`dispatch-homebrew-sync`, which only returns success once the tap's
  # own sync-release.yml has actually finished) -- must have succeeded
  # first. If either failed, this job never runs, and the release stays a
  # prerelease indefinitely: visible and inspectable (the tag, assets, and
  # attestation are all real), but not the one `latest` resolves to and
  # not what a `version: latest` consumer receives. That is the fail-
  # closed property `publish-release`'s own comment promises -- enforced
  # here, not merely asserted there.
  finalize-release:
    if: github.ref_type == 'tag'
    needs: [verify-published-action-install, dispatch-homebrew-sync]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Promote from prerelease to the final, latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --prerelease=false \
            --latest
