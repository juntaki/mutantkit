name: Logical-connector schemata expansion (~100 real mutations)

# TEMPORARY, throwaway workflow — same shape as
# relational-schemata-expansion.yml, which this promotion sequence is
# following one operator at a time (logical-connector -> unary-not ->
# return-value-replacement -> ternary-branch-swap). Only
# swift.core.logical-connector-replacement is left enabled: everything else
# schemata-eligible is disabled so any disagreement is unambiguously
# attributable to this one operator, not a mix.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logical-connector-schemata-expansion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expand:
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - projectID: swift-numerics-integer-utilities
            repositoryURL: https://github.com/apple/swift-numerics.git
            commitSHA: 899af71c0256d0ad181e3b7eb3453a165d928a5
            sourcePatterns: '["Sources/IntegerUtilities/**/*.swift"]'

          - projectID: swift-syntax-small-files
            repositoryURL: https://github.com/apple/swift-syntax.git
            commitSHA: 60e8eb850721b5a6eebbd973b39f450a16553bd9
            sourcePatterns: >-
              ["Sources/SwiftSyntax/AbsolutePosition.swift",
               "Sources/SwiftSyntax/MemoryLayout.swift",
               "Sources/SwiftSyntax/CommonAncestor.swift",
               "Sources/SwiftSyntax/SourceLength.swift",
               "Sources/SwiftSyntax/SyntaxIdentifier.swift",
               "Sources/SwiftSyntax/Utils.swift",
               "Sources/SwiftSyntax/AbsoluteSyntaxInfo.swift",
               "Sources/SwiftSyntax/EditorPlaceholder.swift"]

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build MutantKit (release, production registry)
        run: swift build -c release --product mutantkit

      - name: Build the schemata runtime static library
        run: swift build -c release --product MutantKitSchemataRuntime

      - name: Clone the target project at its pinned commit
        run: |
          set -euo pipefail
          git clone "${{ matrix.repositoryURL }}" /tmp/target-project
          cd /tmp/target-project
          git checkout "${{ matrix.commitSHA }}"
          test "$(git rev-parse HEAD)" = "${{ matrix.commitSHA }}"

      - name: Write a config scoped to this project's source set, logical-connector-replacement only
        working-directory: /tmp/target-project
        run: |
          cat > mutantkit.yml <<EOF
          version: 1
          project:
            kind: swiftPackageMacOS
          sources:
            include: ${{ matrix.sourcePatterns }}
          operators:
            profile: default
            disable: ["swift.core.bool-literal-inversion", "swift.core.relational-operator-replacement", "swift.core.return-value-replacement", "swift.core.ternary-branch-swap", "swift.core.unary-not-removal"]
          reports: [json]
          EOF
          sed 's/^version: 1$/version: 1\nexecution:\n  strategy: isolated/' mutantkit.yml > mutantkit-isolated.yml
          sed 's/^version: 1$/version: 1\nexecution:\n  strategy: schemata/' mutantkit.yml > mutantkit-schemata.yml

      - name: Plan (shared by both strategies — same MutationIDs either way)
        working-directory: /tmp/target-project
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.build/release/mutantkit" plan --project-root . -c mutantkit.yml -o plan.json
          echo "planned candidates:"
          python3 -c "import json; plan = json.load(open('plan.json')); print(len(plan['mutations']))"

      - name: Isolated run
        working-directory: /tmp/target-project
        run: |
          set -euo pipefail
          start=$(date +%s)
          "$GITHUB_WORKSPACE/.build/release/mutantkit" run \
            --project-root . -c mutantkit-isolated.yml \
            --plan plan.json --output report-isolated.json --no-resume --workers 5
          end=$(date +%s)
          echo "isolated_wall_seconds=$((end - start))" >> "$GITHUB_ENV"

      - name: Schemata run
        working-directory: /tmp/target-project
        env:
          MUTANTKIT_SCHEMATA_RUNTIME_LIB_OVERRIDE: ${{ github.workspace }}/.build/release
        run: |
          set -euo pipefail
          start=$(date +%s)
          "$GITHUB_WORKSPACE/.build/release/mutantkit" run \
            --project-root . -c mutantkit-schemata.yml \
            --plan plan.json --output report-schemata.json --no-resume --workers 5
          end=$(date +%s)
          echo "schemata_wall_seconds=$((end - start))" >> "$GITHUB_ENV"

      - name: Compare isolated vs schemata verdicts
        working-directory: /tmp/target-project
        run: |
          set -euo pipefail
          python3 - <<PY
          import json

          isolated = json.load(open("report-isolated.json"))
          schemata = json.load(open("report-schemata.json"))

          def by_id(report):
              return {r["point"]["id"]: r for r in report["results"]}

          iso = by_id(isolated)
          sch = by_id(schemata)

          all_ids = sorted(set(iso) | set(sch))
          disagreements = []
          for mid in all_ids:
              i = iso.get(mid)
              s = sch.get(mid)
              if i is None or s is None:
                  disagreements.append(f"{mid}: missing from one backend (isolated={i is not None} schemata={s is not None})")
                  continue
              if i["outcome"] != s["outcome"]:
                  disagreements.append(f"{mid}: isolated={i['outcome']} schemata={s['outcome']}")

          print(f"=== ${{ matrix.projectID }} ===")
          print(f"mutations compared: {len(all_ids)}")
          print(f"isolated wall: ${isolated_wall_seconds}s  schemata wall: ${schemata_wall_seconds}s")
          print(f"disagreements: {len(disagreements)}")
          for d in disagreements:
              print(f"  {d}")

          if disagreements:
              raise SystemExit(1)
          PY
        env:
          isolated_wall_seconds: ${{ env.isolated_wall_seconds }}
          schemata_wall_seconds: ${{ env.schemata_wall_seconds }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logical-connector-schemata-expansion-${{ matrix.projectID }}
          path: |
            /tmp/target-project/plan.json
            /tmp/target-project/report-isolated.json
            /tmp/target-project/report-schemata.json
          if-no-files-found: warn
          retention-days: 14
