name: Diagnostic - focused test rerun

# Temporary, manually-triggered diagnostic for isolating a specific
# swift-testing suite/test under the exact same runner conditions as the
# `unit` job (same runner image, same toolchain discovery), without paying
# for a full-suite `swift test` run each time. Not part of the normal
# push/PR gate. Remove once the investigation it exists for is done.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "swift test --filter argument"
        required: true

jobs:
  focused-test:
    name: Focused test rerun
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: |
          swift --version && xcodebuild -version
          echo "CPU count: $(sysctl -n hw.ncpu)"
      - name: Build
        shell: bash
        run: swift build --build-tests
      - name: Focused test
        shell: bash
        run: swift test --filter "${{ inputs.filter }}"
