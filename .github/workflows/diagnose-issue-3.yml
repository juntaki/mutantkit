name: Diagnose issue #3

# TEMPORARY, throwaway workflow for investigating
# https://github.com/juntaki/mutantkit/issues/3 — never intended to reach
# main. Kept separate from ci.yml so this branch's own experiments (a
# trimmed matrix, extra env vars) can never accidentally land in the real
# CI config via a stray merge.
#
# No `needs: unit`: this workflow's only job builds its own test binary
# directly, so it does not pay for a redundant Unit-tests job's build+test
# cycle before starting.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - diag/issue-3-round2

permissions:
  contents: read

concurrency:
  group: diagnose-issue-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-project:
    name: Diagnose (xcode-project)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Available simulators
        run: xcrun simctl list devices available | grep -i iphone || true
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log
      - name: Acceptance
        shell: bash
        env:
          MUTANTKIT_ACCEPTANCE: "1"
          MUTANTKIT_ACCEPTANCE_SIMULATOR: "1"
          MUTANTKIT_DIAG_ISSUE3: "1"
        run: |
          set -o pipefail
          swift test --filter XcodeProjectAcceptanceTests 2>&1 | tee acceptance.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-issue-3-logs
          path: |
            build.log
            acceptance.log
          if-no-files-found: warn
          retention-days: 14
