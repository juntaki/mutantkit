sonar.projectKey=juntaki_mutantkit
# Confirmed against the live SonarCloud project (public juntaki/mutantkit
# was imported): https://sonarcloud.io/api/components/show?component=juntaki_mutantkit
# returns organization "juntaki", key "juntaki_mutantkit".
sonar.organization=juntaki

sonar.sources=Sources
sonar.tests=Tests

# Fixtures/, Research/, and reference/ mirror .swiftlint.yml's own `excluded:` list
# (sample projects, research notes, and gitignored third-party clones — none
# of it is shipped code). .build is local/CI build output, never checked in.
# The four research/probe/benchmark-only executable targets are excluded by
# path even though they live under Sources/, same rationale as
# codecov.yml's ignore list — see the comment there for why each one is
# excluded and why SchemataEligibilityClassifier needs a path-based
# exclusion rather than a target-based one.
sonar.exclusions=Fixtures/**,Research/**,reference/**,.build/**,\
  Sources/BenchmarkRunner/**,\
  Sources/BudgetV2Eval/**,\
  Sources/PlanSubsetDerivation/**,\
  Sources/SchemataEligibilityClassifier/**,\
  Sources/PlanStats/**,\
  Sources/SchemataChunkBuildProbe/**,\
  Sources/DirectXCTestInvokeProbe/**

sonar.coverage.exclusions=Fixtures/**,Research/**,reference/**,.build/**,\
  Sources/BenchmarkRunner/**,\
  Sources/BudgetV2Eval/**,\
  Sources/PlanSubsetDerivation/**,\
  Sources/SchemataEligibilityClassifier/**,\
  Sources/PlanStats/**,\
  Sources/SchemataChunkBuildProbe/**,\
  Sources/DirectXCTestInvokeProbe/**

# Coverage: CI produces a single merged lcov.info (see ci.yml's
# `coverage` aggregation job), which Codecov consumes directly and which
# `Scripts/lcov-to-sonar-coverage.py` converts to Sonar's Generic Test
# Coverage XML (SonarCloud's own Swift analyzer has no first-party
# coverage importer, and the community `sonar-swift` plugin's coverage
# support targets `xcodebuild` + `slather` output, not SwiftPM's
# `llvm-cov` lcov). `sonar.coverageReportPaths` is set on the scanner
# CLI invocation in ci.yml (`-Dsonar.coverageReportPaths=sonar-coverage.xml`),
# not here, because the converted file only exists inside that one CI
# job's workspace — declaring the property here would make every other
# invocation (a local `sonar-scanner` run with no such file) warn about a
# missing report instead of just skipping coverage import cleanly.
